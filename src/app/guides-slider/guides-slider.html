<section class="guides-slider-section">
  <div class="container">

    <!-- Header Row -->
    <div class="slider-header">
      <div class="header-left">
        <h2 class="section-title">JDM Buying Advice and Guides</h2>
        <a class="view-all" routerLink="/guides">View All <span>→</span></a>
      </div>
      <div class="arrows">
        <button class="arrow" (click)="prev()" [disabled]="currentIndex === 0">
          <svg width="10" height="16" viewBox="0 0 10 16" fill="none">
            <path d="M8.5 1.5L1.5 8L8.5 14.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="arrow" (click)="next()" [disabled]="currentIndex >= maxIndex">
          <svg width="10" height="16" viewBox="0 0 10 16" fill="none">
            <path d="M1.5 1.5L8.5 8L1.5 14.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Cards Track -->
    <div class="slider-viewport">
      <div class="slider-track" [style.transform]="translateX">
        <div class="guide-card"
             *ngFor="let guide of guides; let i = index"
             [routerLink]="['/guide', i]">
          <div class="guide-image-wrap">
            <img [src]="guide.image" [alt]="guide.title" class="guide-image" />
          </div>
          <div class="guide-info">
            <h3 class="guide-title">{{ guide.title }}</h3>
            <p class="guide-desc">{{ guide.desc }}</p>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>
